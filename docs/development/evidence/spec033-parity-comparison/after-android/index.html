<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>UX2 Android corrigido</title><style>body{font:16px system-ui;background:#120f0c;color:#f5f0e8;margin:20px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;max-width:430px}select{padding:8px}a{color:#ffc45b}</style><h1>Protótipo / Android corrigido</h1><p>Páginas isoladas sem shell; não representa aceite de integração. Fonte200% é teste de acessibilidade, referência original usa100%. <a href="manifest.json">Manifesto</a></p><select id="state"><option>catalog</option><option>review</option><option>payment</option></select><select id="width"><option>390</option><option>360</option><option>430</option></select><select id="font"><option>100</option><option>200</option></select><main></main><script>function render(){const s=document.querySelector('#state').value,w=document.querySelector('#width').value,f=document.querySelector('#font').value;document.querySelector('main').replaceChildren();for(const [label,path] of [['Protótipo',s==='payment'?'../prototype-payment-'+w+'.png':'../prototype-native-'+s+'-'+w+'.png'],['Android corrigido','android-'+s+'-'+w+'-f'+f+'.png']]){const a=document.createElement('article'),h=document.createElement('h2'),i=document.createElement('img');h.textContent=label;i.src=path;i.alt=label+' '+s;a.append(h,i);document.querySelector('main').append(a)}}document.querySelectorAll('select').forEach(e=>e.onchange=render);render()</script></html>
