<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>UX2 correções Web</title><style>body{background:#120f0c;color:#f5f0e8;font:16px system-ui;margin:20px}select{padding:8px}main{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px}img{width:100%}a{color:#ffc45b}</style><h1>Protótipo / antes / depois</h1><p>Correções Web — fonte1. Capturas controladas; não comprovam integração ou paridade de todos os estados. <a href="manifest.json">Manifesto e limites</a></p><select id="state"><option>catalog</option><option>review</option><option>tab</option><option>payment</option></select><select id="width"><option>390</option><option>360</option><option>430</option><option>1280</option></select><main></main><script>function render(){const s=document.querySelector('#state').value,w=document.querySelector('#width').value;document.querySelector('main').replaceChildren();for(const [label,path] of [['Protótipo','../prototype-'],['Web antes','../web-'],['Web depois','web-']]){const a=document.createElement('article'),h=document.createElement('h2'),i=document.createElement('img');h.textContent=label;i.src=path+s+'-'+w+'.png';i.alt=label+' '+s+' '+w;a.append(h,i);document.querySelector('main').append(a)}}document.querySelectorAll('select').forEach(e=>e.onchange=render);render()</script></html>
