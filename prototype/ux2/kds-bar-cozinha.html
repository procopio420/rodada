<div id="app"><div class="controls"><div class="ctrlgroup"><span>Dispositivo</span><button class="control active" data-device="mobile">Celular</button><button class="control" data-device="tablet">Tablet</button><button class="control" data-device="desktop">Desktop</button></div><div class="ctrlgroup"><span>Estação</span><button class="control active" data-station="BAR">Bar</button><button class="control" data-station="KITCHEN">Cozinha</button></div><div class="ctrlgroup"><button class="control" data-scenario="peak">Simular pico · 30</button><button class="control" data-reset="1">↻ Reiniciar</button></div></div><div class="stage" id="stage"><div class="holder" id="holder"><div class="surface mobile" id="surface"><header class="head"><div class="heading"><div class="wordmark">rodada<span>.</span></div><div class="divider"></div><div><div class="sub">PRODUÇÃO 2.0</div><div class="station" id="stationTitle">Bar</div></div></div><div class="headtools"><span class="round">22:57</span><button data-act="new" title="Simular pedido novo">+ Pedido</button><button data-act="connection" id="connectionBtn" title="Simular rede">● Online</button></div></header><div class="summary" id="summary"></div><nav class="mainnav" id="nav"></nav><div id="alerts"></div><main class="work" id="work"></main><nav class="bottombar" id="bottom"></nav><footer class="footnote">Protótipo navegável · dados fictícios. Transições, alertas e operações de correção são simulações; não há conexão com a API.</footer><div id="modalHost"></div></div></div></div></div><div class="toast" id="toast" hidden role="status"></div></div>
<script>
(function(){'use strict';const root=document.getElementById('app'),stage=document.getElementById('stage'),holder=document.getElementById('holder'),surface=document.getElementById('surface');
 const now=Date.now();let seq=50,device='mobile',station='BAR',view='queue',mode='simple',online=true,sound=false,threshold={BAR:5,KITCHEN:12},expandedOld=false,modal=null,originOrder=null,orders=[],history=[],toastTimer;
 const sample=()=>[
  {id:'O921',dest:'FG84',type:'FICHA',age:3,items:[{name:'Chopp Pilsen',qty:2,station:'BAR',quick:true},{name:'Gin tônica',qty:1,station:'BAR',note:'POUCO GELO'}]},
  {id:'O922',dest:'MESA 12',type:'MESA',age:6,items:[{name:'Água com gás',qty:2,station:'BAR',quick:true},{name:'Burger da casa',qty:2,station:'KITCHEN',note:'1 SEM CEBOLA — preparar separado'}]},
  {id:'O923',dest:'MESA 04',type:'MESA',age:13,items:[{name:'Caipirinha',qty:1,station:'BAR',note:'SEM AÇÚCAR'},{name:'Batata frita',qty:1,station:'KITCHEN',phase:'making'},{name:'Calabresa acebolada',qty:1,station:'KITCHEN',note:'BEM PASSADA'}]},
  {id:'O924',dest:'MESA 08',type:'MESA',age:3,items:[{name:'Pastel de queijo',qty:1,station:'KITCHEN',allergy:'ALERGIA A AMENDOIM — checar contaminação cruzada'}]},
  {id:'O925',dest:'MESA 02',type:'MESA',age:14,items:[{name:'Porção de fritas',qty:1,station:'KITCHEN',ready:1,phase:'ready',readyAge:14},{name:'Refrigerante lata',qty:2,station:'BAR',ready:2,phase:'ready',quick:true,readyAge:3}]}
 ];
 function build(data){let created=Date.now()-data.age*60000;return{id:data.id,created,dest:data.dest,type:data.type,urgent:false,items:data.items.map((i,n)=>({...i,id:data.id+'-'+n,qty:i.qty||1,ready:i.ready||0,picked:0,cancelled:0,phase:i.phase||'new',readyAt:i.ready?Date.now()-(i.readyAge||0)*60000:null,correction:null}))}}
 function init(){orders=sample().map(build);history=[];seq=50;online=true;mode='simple';expandedOld=false;view='queue';modal=null;render()}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const age=o=>Math.max(0,Math.floor((Date.now()-o.created)/60000));const remaining=i=>i.qty-i.ready-i.cancelled;const passqty=i=>i.ready-i.picked;const localItems=o=>o.items.filter(i=>i.station===station);const pending=o=>localItems(o).some(i=>remaining(i)>0);const fresh=()=>orders.filter(pending).sort((a,b)=>(Number(b.urgent)-Number(a.urgent))||(a.created-b.created));
 const readyOrders=()=>orders.filter(o=>localItems(o).some(i=>passqty(i)>0));const readyUnits=()=>orders.reduce((s,o)=>s+localItems(o).reduce((t,i)=>t+passqty(i),0),0);const activeCount=()=>orders.reduce((s,o)=>s+localItems(o).filter(i=>remaining(i)>0&&i.phase==='making').length,0);const breached=o=>age(o)>=threshold[station];
 function notify(msg){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=msg;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,3500)}
 function soundPing(){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),osc=a.createOscillator(),g=a.createGain();osc.frequency.value=820;g.gain.value=.07;osc.connect(g);g.connect(a.destination);osc.start();osc.stop(a.currentTime+.13);osc.onended=()=>a.close()}catch(e){}}
 function label(o){return o.type==='FICHA'?'Ficha · retirada no bar':'Serviço na mesa'}
 function ticket(o){const its=localItems(o).filter(i=>remaining(i)>0);if(!its.length)return '';const allergy=its.some(i=>!!i.allergy);const late=breached(o);let tags=(o.urgent?'<span class="chip">⚡ PRIORIDADE</span>':'')+(allergy?'<span class="chip allergy">ALERGIA</span>':'');let allEligible=its.every(i=>!i.allergy);return '<article class="ticket '+(late?'overdue':'')+' '+(o.urgent?'urgent':'')+' '+(allergy?'allergen':'')+'" aria-label="Pedido '+esc(o.id)+'">'+
 '<div class="thead"><div class="topline"><div><div class="dest">'+esc(o.dest)+'</div><div class="meta">'+esc(label(o))+' · #'+esc(o.id)+'</div></div><div class="time '+(late?'late':'')+'">'+age(o)+' min</div></div>'+tags+'</div>'+
 its.map(i=>'<div class="line"><div class="lineTitle">'+remaining(i)+'× '+esc(i.name)+'</div>'+(i.allergy?'<div class="note allergy">⚠ '+esc(i.allergy)+'</div>':'')+(i.note?'<div class="note">⚑ '+esc(i.note)+'</div>':'')+(i.correction?'<span class="chip remake">'+esc(i.correction)+'</span>':'')+
 '<div class="phase '+(i.ready?'good':'')+'">'+(i.ready?i.ready+' de '+i.qty+' prontos · ':'')+(i.phase==='making'?'Em preparo':'Aguardando')+'</div><div class="actions">'+
 (i.phase==='making'||i.quick?'<button class="primary" data-act="ready" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>✓ Pronto'+(remaining(i)>1?' · todos':'')+'</button>':'<button class="primary" data-act="start" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>Iniciar preparo</button>')+
 ((i.phase==='making'||i.quick)&&remaining(i)>1?'<button class="secondary" data-act="one" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>1 pronto</button>':'')+'</div></div>').join('')+
 '<div class="ticketfoot"><button data-act="priority" data-order="'+esc(o.id)+'">'+(o.urgent?'Remover prioridade':'⚡ Prioridade')+'</button><button data-act="print" data-order="'+esc(o.id)+'">Imprimir</button><button data-act="correct" data-order="'+esc(o.id)+'">Corrigir</button>'+(allEligible?'<button class="fill" data-act="all" data-order="'+esc(o.id)+'" '+(!online?'disabled':'')+'>✓ Tudo pronto</button>':'')+'</div></article>'}
 function passCard(o,old){const its=localItems(o).filter(i=>passqty(i)>0&&isOld(i)===old);if(!its.length)return '';return '<article class="passcard '+(old?'old':'')+'"><div class="green">'+(old?'⚠ Pronto há muito tempo':'● PRONTO PARA SAÍDA')+'</div><h3>'+esc(o.dest)+'</h3><div class="meta">#'+esc(o.id)+' · '+esc(label(o))+'</div><p>'+its.map(i=>passqty(i)+'× '+esc(i.name)+(i.allergy?' · ALERGIA':'')).join('<br>')+'</p><div class="actions">'+its.map(i=>'<button class="secondary" data-act="pickup" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>Retirada opcional · '+esc(i.name)+'</button>').join('')+'<button class="quiet" data-act="correct" data-order="'+esc(o.id)+'">Exceção</button></div></article>'}
 function isOld(i){return i.readyAt&&Date.now()-i.readyAt>9*60000}function showNav(){let names=[['queue','▤ Pedidos'],['ready','✓ Passe'],['all','▦ All Day'],['settings','⚙ Ajustes']];if(station==='KITCHEN'&&mode==='expedite')names.splice(2,0,['expedite','↗ Expedição']);let v=names.map(([k,n])=>'<button data-view="'+k+'" class="'+(view===k?'active':'')+'" aria-current="'+(view===k?'page':'false')+'">'+n+(k==='ready'?' ('+readyUnits()+')':'')+'</button>').join('');document.getElementById('nav').innerHTML=v;document.getElementById('bottom').innerHTML=v;}
 function content(){const el=document.getElementById('work');if(view==='queue'){
 const list=fresh();el.innerHTML='<div class="sect"><strong>Pedidos para produzir</strong><small>'+list.length+' tickets · mais antigos primeiro</small></div>'+
 (list.length?'<div class="ticketgrid">'+list.map(ticket).join('')+'</div>':'<div class="empty">✓ Tudo em dia.<br>Nenhum pedido aguardando produção.</div>')+
 '<div class="tools"><button data-act="simulate">+ Simular pedido novo</button>'+(station==='KITCHEN'?'<button data-act="mode">'+(mode==='simple'?'Ativar expedição':'Desativar expedição')+'</button>':'')+'</div>';return}
 if(view==='ready'){
 const freshCards=readyOrders().map(o=>passCard(o,false)).filter(Boolean),oldCards=readyOrders().map(o=>passCard(o,true)).filter(Boolean);el.innerHTML='<div class="sect"><strong>Passe · pronto para saída</strong><small>'+readyUnits()+' unidades</small></div>'+(freshCards.length?'<div class="passgrid">'+freshCards.join('')+'</div>':'<div class="empty">Nenhum item pronto recentemente.</div>')+
 (oldCards.length?'<div class="tools"><button data-act="old">'+(expandedOld?'Ocultar':'Ver')+' prontos antigos ('+oldCards.length+')</button></div>'+(expandedOld?'<div class="passgrid" style="margin-top:12px">'+oldCards.join('')+'</div>':''):'')+
 '<p class="meta" style="margin-top:20px">A ausência de confirmação não significa entrega. Prontos antigos continuam recuperáveis e auditáveis.</p>';return}
 if(view==='all'){let map={};orders.forEach(o=>localItems(o).forEach(i=>{let q=remaining(i);if(q>0)map[i.name]=(map[i.name]||0)+q}));let names=Object.keys(map).sort((a,b)=>a.localeCompare(b,'pt-BR'));el.innerHTML='<div class="sect"><strong>All Day · unidades pendentes</strong><small>Quantidades por produto; customizações preservadas nos tickets</small></div>'+(names.length?'<div class="allDayGrid">'+names.map(n=>'<div class="allDayRow"><strong>'+esc(n)+'</strong><b>'+map[n]+'</b></div>').join('')+'</div>':'<div class="empty">Sem unidades pendentes.</div>')+'<p class="meta" style="margin-top:15px">Resumo consultivo por produto; customizações não são mescladas nos tickets nem alteradas em lote.</p>';return}
 if(view==='settings'){el.innerHTML='<div class="sect"><strong>Configuração da estação</strong><small>Simulação local</small></div><div class="settings"><div class="setting"><div><b>Alerta de atraso · '+(station==='BAR'?'Bar':'Cozinha')+'</b><div class="meta">Limiar ilustrativo, configurável por estação</div></div><label><input aria-label="Minutos de alerta" id="threshold" type="number" min="1" max="60" value="'+threshold[station]+'"> min</label></div><div class="setting"><div><b>Som de pedido novo</b><div class="meta">Opt-in: não reproduzir automaticamente sem permissão</div></div><button data-act="sound">'+(sound?'Ativado':'Desativado')+'</button></div>'+(station==='KITCHEN'?'<div class="setting"><div><b>Expedição / passe consolidado</b><div class="meta">Opcional para bares maiores</div></div><button data-act="mode">'+(mode==='expedite'?'Ativada':'Desativada')+'</button></div>':'')+'<div class="setting"><div><b>Conexão de demonstração</b><div class="meta">Offline permite leitura, não confirma novas ações</div></div><button data-act="connection">'+(online?'Online':'Offline')+'</button></div></div>';return}
 if(view==='expedite'){const ids=orders.filter(o=>o.items.some(i=>i.station==='KITCHEN'));el.innerHTML='<div class="sect"><strong>Expedição consolidada</strong><small>Visão cruzada; sem obrigar conferência manual</small></div><div class="expGrid">'+ids.map(o=>'<div class="expCard"><h3>'+esc(o.dest)+'</h3><div class="meta">Pedido #'+esc(o.id)+'</div>'+['KITCHEN','BAR'].map(st=>{let it=o.items.filter(i=>i.station===st);if(!it.length)return '';let n=it.reduce((s,i)=>s+Math.max(0,i.qty-i.cancelled),0),r=it.reduce((s,i)=>s+i.ready,0);return '<div class="expRow"><span>'+(st==='BAR'?'Bar':'Cozinha')+' · '+it.map(i=>esc(i.name)).join(', ')+'</span><b class="'+(r===n?'ready':'pending')+'">'+r+'/'+n+' prontos</b></div>'}).join('')+'</div>').join('')+'</div><p class="meta" style="margin-top:15px">Estado consolidado por itens. A expedição é opcional e não muda o histórico de preparo.</p>';return}
 }
 function render(){root.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===device));root.querySelectorAll('[data-station]').forEach(b=>b.classList.toggle('active',b.dataset.station===station));surface.className='surface '+device;document.getElementById('stationTitle').textContent=station==='BAR'?'Bar':'Cozinha';document.getElementById('connectionBtn').textContent=online?'● Online':'● Offline';
 document.getElementById('summary').innerHTML=[['Pedidos na fila',fresh().length],['Em preparo',activeCount()],['Unidades prontas',readyUnits()]].map(([l,n])=>'<div><strong>'+n+'</strong><span>'+l+'</span></div>').join('');showNav();document.getElementById('alerts').innerHTML=(!online?'<div class="status danger">Sem conexão: últimos dados conhecidos. Ações de produção pausadas até reconectar. Não repetir comandos sem conferir o estado.</div>':'')+(fresh().some(o=>localItems(o).some(i=>i.allergy))?'<div class="status">⚠ Há pedidos com restrições de alergia. Conferir ingredientes e contaminação cruzada antes do preparo.</div>':'');content();drawModal();requestAnimationFrame(resize)}
 function resize(){let w={mobile:390,tablet:850,desktop:1200}[device];let available=Math.max(240,stage.clientWidth-26);let scale=Math.min(1,available/w);surface.style.width=w+'px';surface.style.transform='scale('+scale+')';holder.style.width=Math.ceil(w*scale)+'px';holder.style.height=Math.ceil(surface.offsetHeight*scale)+'px'}
 function findItem(id){for(const o of orders){let i=o.items.find(i=>i.id===id);if(i)return {o,i}}return null}
 function log(type,ref){history.push({type,ref,at:Date.now()})}
 function newOrder(){let id='N'+(++seq),stationName=station;let opts=stationName==='BAR'?[['Chopp Pilsen',true],['Gin tônica',false],['Água com gás',true]]:[['Batata frita',false],['Pastel de queijo',false],['Burger da casa',false]];let n=opts[seq%opts.length];orders.unshift(build({id,dest:'MESA '+String((seq%20)+1).padStart(2,'0'),type:'MESA',age:0,items:[{name:n[0],qty:seq%3===0?2:1,station,quick:n[1]}]}));log('new',id);notify('Pedido '+id+' recebido na estação');soundPing()}
 function correction(o){modal=o.id;originOrder=o.id;drawModal()}
 function drawModal(){let host=document.getElementById('modalHost');['.head','.summary','.mainnav','#alerts','.work','.bottombar'].forEach(sel=>{let x=surface.querySelector(sel);if(x)x.inert=!!modal});if(!modal){host.innerHTML='';if(originOrder){const id=originOrder;originOrder=null;requestAnimationFrame(()=>{root.querySelector('[data-act=correct][data-order="'+id+'"]')?.focus()})}return}const o=orders.find(o=>o.id===modal);if(!o){modal=null;host.innerHTML='';return}host.innerHTML='<div class="popup"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle">Corrigir pedido '+esc(o.id)+'</h3><p>Uma correção não apaga o histórico. Se o item já ficou pronto, não retornamos o mesmo item para “em preparo”. Uma refeitura cria uma nova linha vinculada ao original.</p>'+o.items.filter(i=>i.station===station).map(i=>'<div class="line"><strong>'+esc(i.name)+'</strong><div class="meta">'+(remaining(i)>0?'Pendente: '+remaining(i):'Sem unidades pendentes')+' · Prontos: '+i.ready+' · Cancelados: '+i.cancelled+'</div><div class="actions">'+(remaining(i)>0?'<button class="secondary" data-act="cancel" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>Cancelar pendente</button>':'')+'<button class="secondary" data-act="remake" data-id="'+esc(i.id)+'" '+(!online?'disabled':'')+'>Solicitar refeitura</button></div></div>').join('')+'<p class="meta">No produto real, autorização, motivo e efeitos financeiros serão validados e auditados pela API.</p><div class="actions"><button class="primary" data-act="close">Voltar à produção</button></div></section></div>';const button=host.querySelector('[data-act="close"]');button?.focus()}
 function act(button){const kind=button.dataset.act,orderId=button.dataset.order,itemId=button.dataset.id;const match=itemId?findItem(itemId):null;let o=orderId?orders.find(v=>v.id===orderId):match?.o,i=match?.i;const needsOnline=['ready','one','start','all','pickup','cancel','remake'];if(!online&&needsOnline.includes(kind)){notify('Offline: operação não enviada. Reconecte e confira.');return}
 if(kind==='new'||kind==='simulate'){newOrder()}else if(kind==='connection'){online=!online;notify(online?'Reconectado. Estado da demonstração atualizado.':'Simulação offline: mutações pausadas.')}else if(kind==='start'&&i){i.phase='making';log('start',i.id)}else if(kind==='ready'&&i&&remaining(i)>0){i.ready+=remaining(i);i.phase='ready';i.readyAt=Date.now();log('ready',i.id)}else if(kind==='one'&&i&&remaining(i)>0){i.ready++;i.phase=remaining(i)>0?'making':'ready';i.readyAt=Date.now();log('ready-one',i.id)}else if(kind==='all'&&o){o.items.filter(i=>i.station===station&&remaining(i)>0&&!i.allergy).forEach(i=>{i.ready+=remaining(i);i.readyAt=Date.now();i.phase='ready';log('ready-all',i.id)});}else if(kind==='priority'&&o){o.urgent=!o.urgent;log('priority',o.id)}else if(kind==='print'){notify('Solicitação de impressão simulada; nenhum papel foi impresso.')}else if(kind==='correct'&&o){correction(o);return}else if(kind==='pickup'&&i){i.picked=i.ready;log('pickup',i.id)}else if(kind==='cancel'&&i&&remaining(i)>0){i.cancelled+=remaining(i);log('cancel',i.id);notify('Cancelamento simulado registrado no histórico');modal=null}else if(kind==='remake'&&i&&o){let clone={...i,id:'R'+(++seq),qty:1,ready:0,picked:0,cancelled:0,phase:'new',readyAt:null,correction:'REFAZER '+i.id};o.items.push(clone);log('remake',i.id);notify('Nova linha de refeitura criada; original preservado');modal=null}else if(kind==='close'){modal=null}else if(kind==='old'){expandedOld=!expandedOld}else if(kind==='mode'){mode=mode==='simple'?'expedite':'simple';if(station==='KITCHEN'&&mode==='expedite')view='expedite';else view='queue'}else if(kind==='sound'){sound=!sound;notify(sound?'Som ativado':'Som desativado')}render()}
 root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.device){device=b.dataset.device;render();return}if(b.dataset.station){station=b.dataset.station;view='queue';render();return}if(b.dataset.view){view=b.dataset.view;modal=null;render();return}if(b.dataset.reset){init();return}if(b.dataset.scenario){init();for(let k=0;k<25;k++){let id='P'+(500+k),st=k%2===0?'BAR':'KITCHEN',name=st==='BAR'?(k%3?'Chopp Pilsen':'Caipirinha'):(k%3?'Burger da casa':'Batata frita');orders.push(build({id,dest:'MESA '+String(k+10).padStart(2,'0'),type:'MESA',age:2+k%19,items:[{name,qty:1+k%3,station:st,quick:name==='Chopp Pilsen'}]}))}notify('Cenário de pico carregado: 30 pedidos');render();return}if(b.dataset.act){act(b)}});
 root.addEventListener('change',e=>{if(e.target.id==='threshold'){threshold[station]=Math.min(60,Math.max(1,Number(e.target.value)||5));render()}});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}if(e.key==='Tab'&&modal){const els=[...root.querySelectorAll('#modalHost button:not(:disabled)')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
 if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(stage);else window.addEventListener('resize',resize);
 init();setInterval(()=>{if(!modal&&(view==='queue'||view==='ready'))render()},60000);
})();</script></body></html>
