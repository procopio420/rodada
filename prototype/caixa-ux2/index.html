For(t.id)?`<div class="note red">${icon('alert')} Há uma cobrança pendente ou incerta. Consulte o resultado antes de cobrar novamente. <button class="quiet" data-act="resolve-uncertain">Verificar</button></div>`:''}</div><div class="due-panel"><div><div class="due-label">${d?'RESTANTE A RECEBER':'SALDO DA COMANDA'}</div><div class="due-value mono">${fmt(d)}</div></div><span class="badge ${d?'line':'green'}">${d?'Pendente':'Quitada'}</span></div><div class="detail-actions">${t.closed?`<button class="primary full" disabled>${icon('check')} Comanda encerrada</button>`:d>0?`${t.splitPlan?`<button class="secondary" data-act="split" ${S.simOffline||!!pendingFor(t.id)?'disabled':''}>${icon('split')} Divisão</button><button class="primary" data-act="next-split" ${S.simOffline||!!pendingFor(t.id)?'disabled':''}>${icon('wallet')} Próxima parte ${fmt(Math.ceil(d/Math.max(1,t.splitPlan.totalParts-t.splitPlan.paidParts)))}</button><button class="quiet" data-act="pay" ${S.simOffline||!!pendingFor(t.id)?'disabled':''}>Outro valor</button>`:`<button class="secondary" data-act="split" ${S.simOffline||!!pendingFor(t.id)?'disabled':''}>${icon('split')} Dividir</button><button class="primary" data-act="pay" ${S.simOffline||!!pendingFor(t.id)?'disabled':''}>${icon('wallet')} Cobrar ${fmt(d)}</button>`}`:`<button class="primary full" data-act="close-tab">${icon('check')} Encerrar comanda</button>`}</div></article>`}

function receive(){const uncertain=db.attempts.filter(a=>['WAITING','UNKNOWN'].includes(a.status));return heading('OPERAÇÃO / RECEBIMENTOS','Receber','Encontre a conta, cobre e siga para o próximo cliente.',`<div><button class="secondary desktop-action" data-act="quick-sale">${icon('plus')} Venda rápida</button><button class="secondary quick-mobile" data-act="quick-sale">${icon('plus')} Venda</button></div>`)+`${uncertain.length?`<div class="note red pending-banner" role="status">${icon('alert')} <div><strong>${uncertain.length} cobrança(s) sem confirmação</strong><div class="tiny">Verifique o resultado canônico antes de tentar cobrar novamente.</div></div><button class="secondary" data-act="go-uncertain">Verificar agora</button></div>`:'' }<div class="receive-grid ${S.mobileDetail?'mobile-selected':''}">${receiveList()}<div class="detail">${detail()}</div></div>${mobilePaybar()}<div class="demo-hint">${icon('info')} Valores fictícios. Cobranças e autorizações são simulações, sem comunicação com provedores.</div>`}

function shiftView(){let d=db.drawer;const blind=d.counting&&d.counted===null;let closed=!d.open&&d.counted!==null;let stat=closed?'Fechado':d.counting?'Em conferência':d.open?'Aberto':'Ainda não aberto';return heading('CONTROLE / DINHEIRO FÍSICO','Turno de caixa','Controle a gaveta sem misturar o saldo das comandas com dinheiro físico.')+`<div class="strip-stats"><div class="card metric"><div class="metric-label">${blind?'CONTAGEM CEGA':d.open?'SALDO ESPERADO NA GAVETA':'ÚLTIMO SALDO ESPERADO'}</div><div class="metric-value mono">${blind?'Valor oculto':fmt(drawerExpected())}</div><div class="metric-support">Caixa principal · somente dinheiro físico</div></div><div class="card metric"><div class="metric-label">FUNDO INICIAL</div><div class="metric-value mono">${blind?'Oculto':fmt(d.float)}</div><div class="metric-support">${blind?'Revelado após registrar a contagem':`Início do turno #${d.shiftNum}`}</div></div><div class="card metric"><div class="metric-label">SITUAÇÃO DO TURNO</div><div class="metric-value" style="font-size:22px;color:${d.open?'var(--green)':'var(--muted)'}">${stat}</div><div class="metric-support">${d.counting?'Recebimentos em dinheiro pausados':d.open?'Operação normal':'Aguardando nova abertura'}</div></div></div><div class="turn-layout"><div class="card panel-pad"><div class="section-head"><div class="section-title">${d.counting?'Conferência em andamento':d.open?'Movimentar dinheiro':'Situação do caixa'}</div><span class="badge ${d.open?'green':'red'}">${d.counting?'Conferindo':d.open?'Operando':'Fechado'}</span></div>${d.open&&!d.counting?`<p class="muted" style="font-size:12px;margin-top:0">Suprimentos e sangrias alteram o saldo físico previsto. Vendas por Pix/cartão não entram aqui.</p><div class="operation-actions"><button class="secondary" data-act="movement" data-type="out">${icon('minus')} <span>Sangria</span></button><button class="secondary" data-act="movement" data-type="in">${icon('plus')} <span>Suprimento</span></button></div><div class="divider"></div><div class="section-head"><div class="section-title">Conferência</div><span class="tiny">Ao iniciar, movimentos em dinheiro param</span></div><p class="muted" style="font-size:12px">Conte o dinheiro físico antes de comparar com o valor esperado.</p><button class="primary full" data-act="start-count">${icon('coins')} Conferir e fechar turno</button>`:d.counting?`<div class="note blue">${icon('lock')} A gaveta está em conferência: nenhuma movimentação em dinheiro deve ser registrada.</div><button class="primary full" data-act="start-count" style="margin-top:15px">${icon('coins')} Retomar conferência</button><button class="secondary full" data-act="resume-count" style="margin-top:8px">${icon('lock')} Voltar a operar (gerente)</button>`:`<p class="muted" style="font-size:13px">${closed?'A contagem foi registrada. O histórico permanece disponível para revisão.':'Sem turno aberto neste ponto de caixa.'}</p>${closed?`<div class="review-box"><div class="review-line"><span>Total contado</span><strong>${fmt(d.counted)}</strong></div><div class="review-line"><span>Diferença</span><strong style="color:${d.difference?'var(--red)':'var(--green)'}">${d.difference>0?'+':''}${fmt(d.difference)}</strong></div><div class="review-line"><span>Revisão</span><strong>${d.review==='pending'?'Aguardando gerente':d.review==='reviewed'?'Revisada':'Não necessária'}</strong></div></div>${d.review==='pending'?`<button class="secondary full" style="margin-top:12px" data-act="review">${icon('alert')} Revisar divergência</button>`:''}`:''}<button class="primary full" style="margin-top:14px" data-act="open-shift">${icon('wallet')} Abrir novo turno</button>`}</div><div class="card panel-pad"><div class="section-head"><div class="section-title">${blind?'Movimentações protegidas':'Últimas movimentações'}</div><span class="tiny">Turno #${d.shiftNum}</span></div>${blind?`<div class="note blue">${icon('lock')} Os valores ficam ocultos até registrar a contagem.</div>`:d.movements.slice().reverse().slice(0,7).map(m=>`<div class="history-row"><div><div class="history-label">${esc(m.kind)}</div><div class="history-sub">${esc(m.detail)} · ${esc(m.time)}</div></div><div class="history-val mono" style="color:${m.amount<0?'var(--red)':'var(--ink)'}">${m.amount<0?'−':'+'} ${fmt(Math.abs(m.amount))}</div></div>`).join('')}<button class="quiet" data-act="nav" data-view="activity" ${blind?'disabled title="Finalize a contagem para ver o histórico"':''} style="margin-top:7px">${icon('right')} Ver toda atividade</button></div></div><div class="demo-hint">O valor previsto é um cálculo simulado do turno. Não representa extrato bancário nem confirmação de Pix/cartão.</div>`}
function activityView(){let arr=db.activity.filter(a=>S.actFilter==='all'||(S.actFilter==='payments'?a.type==='payment':a.type==='move'));return heading('CONTROLE / AUDITORIA','Atividade','Recebimentos, movimentos e decisões, sem esconder o que aconteceu.')+`<div class="card panel-pad"><div class="section-head"><div class="section-title">Histórico recente</div><button class="secondary" data-act="toggle-offline">${icon('refresh')} ${S.simOffline?'Restaurar conexão demo':'Simular offline'}</button></div><div class="seg-tabs">${[['all','Tudo'],['payments','Pagamentos'],['movements','Movimentações']].map(([x,l])=>`<button data-act="activity-filter" data-value="${x}" class="${S.actFilter===x?'active':''}">${l}</button>`).join('')}</div>${db.attempts.filter(a=>['WAITING','UNKNOWN'].includes(a.status)).map(a=>`<div class="note red" style="margin:0 0 15px">${icon('alert')} ${esc(db.tabs.find(t=>t.id===a.tabId)?.code||'Comanda')} · ${fmt(a.amount)} · cobrança não confirmada <button class="quiet" data-act="verify-attempt" data-id="${esc(a.id)}">Verificar</button></div>`).join('')}${arr.length?arr.map(a=>`<div class="activity-item"><span class="activity-icon">${icon(a.type==='payment'?'card':a.amount<0?'minus':'plus')}</span><div><div class="activity-name">${esc(a.title)} ${a.refunded?'<span class="badge purple">Estornado</span>':''}</div><div class="activity-sub">${esc(a.detail)}</div></div><div class="activity-right"><div class="activity-val mono">${a.amount<0?'−':'+'} ${fmt(Math.abs(a.amount))}</div>${a.type==='payment'?`<div><button class="secondary" data-act="receipt" data-id="${a.id}">${icon('print')} Recibo</button> ${!a.refunded?`<button class="quiet" data-act="refund" data-id="${a.id}">Estornar</button>`:''}</div>`:''}</div></div>`).join(''):`<div class="empty">Nenhuma atividade neste filtro.</div>`}</div>`}
function formField(label,name,value,placeholder='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" ${extra} data-input="${name}" value="${esc(value)}" type="${type}" placeholder="${esc(placeholder)}"></div>`}
function modalShell(title,sub,body,bottom='',wide=false){return `<div class="modal-screen" data-act="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><div class="modal-title">${title}</div><div class="modal-desc">${sub}</div></div><button class="tiny-iconbtn" title="Fechar" data-act="modal-close">${icon('x')}</button></div><div class="modal-body">${body}</div>${bottom?`<div class="modal-bottom">${bottom}</div>`:''}</div></div>`}
function paymentModal(){const t=selected();if(!t)return '';let d=due(t),a=parseBR(S.payAmount),valid=Number.isFinite(a)&&a>0&&a<=d, tender=parseBR(S.tendered),method=S.payMethod;if(S.payStage!=='entry')return paymentProcessing(t,a);return modalShell('Receber pagamento',`${t.place} · ${t.label} · saldo ${fmt(d)}`,`<div class="mini-title">FORMA DE PAGAMENTO</div><div class="method-grid">${[['CASH','Dinheiro','bank'],['PIX','Pix','qr'],['CARD','Cartão','card']].map(([v,n,i])=>`<button class="method ${v===method?'active':''}" data-act="method" data-method="${v}">${icon(i)}${n}</button>`).join('')}</div>${S.pendingSplit?`<div class="field"><label>Valor dos itens selecionados (fixo)</label><div class="payment-locked mono">${fmt(a)}</div></div>`:formField('Valor a receber (R$)','payAmount',S.payAmount,'0,00','text','inputmode="decimal" class="money-input"')}${S.pendingSplit?'':`<div class="quick-amounts"><button data-act="amount-preset" data-part="all">Saldo completo</button><button data-act="amount-preset" data-part="half">Metade</button><button data-act="amount-preset" data-part="quarter">25%</button></div>`}${method==='CASH'?`<div style="margin-top:20px">${formField('Valor entregue pelo cliente (R$)','tendered',S.tendered,'0,00','text','inputmode="decimal"')}<div class="quick-amounts">${[5000,10000,20000].filter(n=>n>=a).map(n=>`<button data-act="tender-preset" data-cents="${n}">${fmt(n)}</button>`).join('')}<button data-act="tender-preset" data-cents="${valid?a:0}">Valor exato</button></div></div>`:''}${method==='CASH'&&valid?`<div class="review-box"><div class="review-line"><span>Valor recebido</span><strong>${Number.isFinite(tender)?fmt(tender):'—'}</strong></div><div class="review-line large"><span>Troco a devolver</span><strong style="color:${Number.isFinite(tender)&&tender>=a?'var(--green)':'var(--ink)'}">${Number.isFinite(tender)&&tender>=a?fmt(tender-a):'—'}</strong></div></div>`:`<div class="note blue">${icon('info')} ${method==='PIX'?'O Pix só será registrado depois de confirmado.':method==='CARD'?'A cobrança precisa ter resultado confirmado antes de alterar o saldo.':'Informe o valor recebido para calcular o troco.'}</div>`}${!db.drawer.open&&method==='CASH'?`<div class="note red">${icon('alert')} Não há caixa físico aberto. Selecione outro ponto ou abra um turno antes de receber dinheiro.</div>`:''}`,`<button class="secondary" data-act="modal-close">Cancelar</button><button class="primary" data-act="confirm-payment" ${(!valid||S.simOffline||!!pendingFor(t.id)||(method==='CASH'&&(!db.drawer.open||db.drawer.counting||!Number.isFinite(tender)||tender<a)))?'disabled':''}>${icon('check')} ${method==='CASH'?'Receber':'Continuar'}</button>`)}
function paymentProcessing(t,a){let label=S.payMethod==='PIX'?'Pix':'Cartão';return modalShell(`${label} · aguardando`,`${t.place} · ${fmt(a)}`,`<div style="padding:15px 0;text-align:center"><div style="font-size:44px;color:var(--amber);margin:5px">${icon(S.payMethod==='PIX'?'qr':'card')}</div><div class="count-big mono">${fmt(a)}</div><p class="muted" style="font-size:13px">${S.payMethod==='PIX'?'Apresente o código ao cliente e aguarde a confirmação do provedor.':'Aguardando confirmação do terminal de pagamento.'}</p>${S.payMethod==='PIX'?`<div style="display:grid;place-items:center;padding:15px"><div style="width:132px;height:132px;background:#f2e9df;color:#19130c;display:grid;place-items:center;font:800 12px var(--mono);border-radius:8px">${icon('qr')}<span style="font-size:9px;margin-top:-24px">QR DEMONSTRATIVO</span></div></div>`:''}</div><div class="note blue">${icon('info')} Simulação: escolha abaixo qual resultado o provedor retornou. Nenhum pagamento real é iniciado.</div>`,`<button class="secondary" data-act="pay-unknown">Resultado incerto</button><button class="primary" data-act="pay-success">${icon('check')} Simular confirmado</button>`)}
function splitModal(){let t=selected(),d=due(t),n=t.splitPlan?Math.max(1,t.splitPlan.totalParts-t.splitPlan.paidParts):Math.max(2,S.splitParts),item=splitItemAmount(t);let amount=S.splitMode==='equal'?Math.ceil(d/n):S.splitMode==='value'?parseBR(S.splitValue):item.amount;let valid=Number.isFinite(amount)&&amount>0&&amount<=d;
return modalShell('Dividir pagamento',`${t.place} · Restam ${fmt(d)}`,`<div class="split-switch">${[['equal','Partes iguais'],['value','Por valor'],['items','Por itens']].map(([m,l])=>`<button class="${S.splitMode===m?'active':''}" data-act="split-mode" data-mode="${m}">${l}</button>`).join('')}</div>${S.splitMode==='equal'?`<div class="section-head"><span class="muted">${t.splitPlan?'Pessoas ainda pendentes':'Quantidade de pessoas'}</span><span class="num-controls"><button data-act="split-minus" ${t.splitPlan?'disabled':''}>−</button><span class="pill-value">${n}</span><button data-act="split-plus" ${t.splitPlan?'disabled':''}>+</button></span></div>${t.splitPlan?`<div class="note green">${icon('check')} ${t.splitPlan.paidParts} de ${t.splitPlan.totalParts} partes pagas · cobrar a próxima parte agora.</div>`:''}<div class="review-box"><div class="review-line"><span>Próxima parte</span><strong>${fmt(amount)}</strong></div><div class="review-line"><span>Restante após esta parte</span><strong>${fmt(d-amount)}</strong></div></div>`:S.splitMode==='value'?`${formField('Quanto esta pessoa vai pagar? (R$)','splitValue',S.splitValue,'0,00','text','inputmode="decimal"')}`:`<div class="mini-title">SELECIONE AS UNIDADES DESTA PESSOA</div>${t.items.map((i,idx)=>{let available=i[1]-paidSplitQty(t,idx),q=S.splitQty[idx]||0;return `<div class="split-row"><span class="item-name">${esc(i[0])}<small>${fmt(i[2])}/un. · ${available} disponível(is) de ${i[1]}</small></span><span class="num-controls split-item-counter"><button aria-label="Reduzir ${esc(i[0])}" data-act="split-qty-less" data-index="${idx}" ${q===0?'disabled':''}>−</button><span class="pill-value">${q}</span><button aria-label="Adicionar ${esc(i[0])}" data-act="split-qty-more" data-index="${idx}" ${q>=available?'disabled':''}>+</button></span><strong class="mono">${fmt(q*i[2])}</strong></div>`}).join('')}<div class="review-box split-summary"><div class="review-line"><span>Itens selecionados</span><strong>${fmt(item.base)}</strong></div><div class="review-line"><span>Proporção de serviço/ajustes</span><strong>${fmt(item.fee)}</strong></div><div class="review-line"><span>Subtotal da parcela</span><strong>${fmt(item.amount)}</strong></div></div><div class="note blue">${icon('info')} Unidades pagas ficam indisponíveis nesta divisão. Pagamentos anteriores sem itens atribuídos continuam abatidos do saldo geral.</div>`}<div class="review-box"><div class="review-line large"><span>Valor a cobrar agora</span><strong class="mono">${valid?fmt(amount):'—'}</strong></div>${!valid&&amount>d?`<div class="notice-critical">A seleção excede o saldo restante. Reduza as unidades ou use divisão por valor.</div>`:''}</div>`,`<button class="secondary" data-act="modal-close">Voltar</button><button class="primary" data-act="split-continue" ${!valid?'disabled':''}>${icon('right')} Continuar para pagamento</button>`)}

const saleProducts=[['Chopp Pilsen',1200],['Gin tônica',2400],['Água sem gás',900],['Batata rústica',3900],['Caipirinha',2300],['Refrigerante',800]];
function saleModal(){let lines=saleProducts.map((p,i)=>[p,S.saleCart[i]||0,i]),amount=lines.reduce((n,[[_,price],q])=>n+price*q,0);return modalShell('Venda rápida','Monte um pedido de balcão sem procurar uma mesa',`<div class="mini-title">ITENS MAIS PEDIDOS</div>${lines.map(([[name,price],qty,i])=>`<div class="item-line" style="gap:13px;min-height:64px"><span class="item-name">${esc(name)}<div class="tiny">${fmt(price)} / un.</div></span><div class="num-controls"><button aria-label="Remover ${esc(name)}" data-act="sale-less" data-index="${i}" ${qty===0?'disabled':''}>−</button><span class="pill-value">${qty}</span><button aria-label="Adicionar ${esc(name)}" data-act="sale-more" data-index="${i}">+</button></div></div>`).join('')}<div class="review-box"><div class="review-line large"><span>Total da venda</span><strong class="mono">${fmt(amount)}</strong></div></div><div class="note blue">${icon('info')} Esta demonstração não envia pedidos ao bar/cozinha. Se você sair da cobrança, a venda continuará como comanda aberta na lista.</div>`,`<button class="secondary" data-act="modal-close">Cancelar</button><button class="primary" data-act="sale-commit" ${amount===0?'disabled':''}>${icon('check')} Criar e cobrar</button>`)}
function movementModal(){let out=S.movementType==='out',a=parseBR(S.movementAmount),valid=Number.isFinite(a)&&a>0&&(!out||a<=drawerExpected())&&S.movementReason.trim();return modalShell(out?'Registrar sangria':'Registrar suprimento',`Caixa principal · Turno #${db.drawer.shiftNum}`,`${formField('Valor (R$)','movementAmount',S.movementAmount,'0,00','text','inputmode="decimal"')}<div class="field"><label>Motivo</label><div class="quick-amounts">${(out?['Envio ao cofre','Pagamento autorizado','Troco para outra gaveta']:['Reforço de troco','Transferência de gaveta','Correção operacional']).map(r=>`<button data-act="reason" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>${formField('Descrição ou motivo','movementReason',S.movementReason,'Informe o motivo')}<div class="review-box"><div class="review-line"><span>Saldo físico previsto atual</span><strong class="mono">${fmt(drawerExpected())}</strong></div><div class="review-line large"><span>Após movimento</span><strong class="mono">${Number.isFinite(a)?fmt(drawerExpected()+(out?-a:a)):'—'}</strong></div></div>`,`<button class="secondary" data-act="modal-close">Cancelar</button><button class="primary" data-act="commit-movement" ${!valid?'disabled':''}>${icon('check')} Registrar ${out?'sangria':'suprimento'}</button>`)}
function countModal(){let c=db.drawer.counted!==null?db.drawer.counted:parseBR(S.countInput),valid=Number.isFinite(c);if(S.countStep===1)return modalShell('Conferir caixa','Etapa 1 de 2 · contagem cega',`<div class="note blue" style="margin:0 0 18px">${icon('lock')} Conte o dinheiro antes de comparar. O valor previsto está oculto para evitar influência na contagem.</div>${formField('Quanto dinheiro há na gaveta? (R$)','countInput',S.countInput,'0,00','text','inputmode="decimal" class="money-input"')}<p class="tiny">Informe o total contado. A conferência por notas e moedas será um recurso opcional.</p><div class="stepbar"><span class="step active"></span><span class="step"></span></div>`,`<button class="secondary" data-act="modal-close">Cancelar</button><button class="primary" data-act="count-next" ${!valid?'disabled':''}>Registrar contagem ${icon('right')}</button>`);let diff=c-drawerExpected();return modalShell('Resultado da conferência','Etapa 2 de 2 · comparar e fechar',`<div class="review-box"><div class="review-line"><span>Dinheiro esperado</span><strong class="mono">${fmt(drawerExpected())}</strong></div><div class="review-line"><span>Dinheiro contado</span><strong class="mono">${fmt(c)}</strong></div><div class="review-line large"><span>${diff<0?'Falta no caixa':diff>0?'Sobra no caixa':'Conferência exata'}</span><strong class="mono" style="color:${diff?'var(--red)':'var(--green)'}">${diff>0?'+':''}${fmt(diff)}</strong></div></div>${diff?`<div class="note red">${icon('alert')} A contagem foi registrada e não pode ser editada. A diferença será mantida no fechamento, sem correção automática.</div>`:`<div class="note green">${icon('check')} Dinheiro contado confere com o previsto.</div>`}<div class="stepbar"><span class="step active"></span><span class="step active"></span></div>`,`<button class="primary" data-act="commit-count">${icon('lock')} Fechar turno</button>`)}

document.addEventListener('input',e=>{let k=e.target.dataset.input;if(!k)return;S[k]=e.target.value;if(k==='search'){const list=db.tabs.filter(t=>(S.filter==='all'?!t.closed:S.filter==='requested'?t.requested&&!t.closed:S.filter==='partial'?paid(t)>0&&!t.closed&&due(t)>0:S.filter==='fichas'?t.type==='ficha'&&!t.closed:t.closed)&&`${t.place} ${t.label} ${t.code}`.toLowerCase().includes(S.search.toLowerCase().trim()));if(!list.some(t=>t.id===S.selected))S.selected=list[0]?.id||null;}render()});
document.addEventListener('change',e=>{if(e.target.dataset.check==='split-item'){let i=+e.target.dataset.idx;S.splitItemIds=e.target.checked?[...S.splitItemIds,i]:S.splitItemIds.filter(x=>x!==i);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}else if(e.key==='/'&&!S.modal&&S.view==='receive'&&!/input|textarea/i.test(document.activeElement?.tagName||'')){e.preventDefault();document.querySelector('[data-input=search]')?.focus()}});
render();
})();
</script></body></html>
