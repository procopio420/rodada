services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rodada
      POSTGRES_USER: rodada
      POSTGRES_PASSWORD: rodada
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodada -d rodada"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment: &api-env
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: rodada
      DJANGO_DB_USER: rodada
      DJANGO_DB_PASSWORD: rodada
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      PAYMENT_PROVIDER: TEST
      DEBUG: "1"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [./apps/api:/app]
  worker:
    build: ./apps/api
    command: python manage.py icon_worker
    environment: *api-env
    depends_on:
      api: {condition: service_started}
    volumes: [./apps/api:/app]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_VENUE_ID: 1
      NEXT_PUBLIC_STAFF_ID: 1
    depends_on:
      api: {condition: service_started}
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  postgres-data:
