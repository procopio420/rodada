name: One-off cleanup of superseded CI runs

on:
  push:
    branches:
      - chore/ci-workflow-pruning-20261013

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete Spec 25 CI without disrupting latest API/Web
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'feat/spec025-host-session-rebased';
            const current = await github.rest.repos.getBranch({owner, repo, branch});
            const latest = current.data.commit.sha;
            const statuses = ['queued', 'in_progress'];
            const runs = (await Promise.all(statuses.map(status =>
              github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                {owner, repo, branch, status, per_page: 100})
            ))).flat();
            let cancelled = 0;
            for (const run of runs) {
              // Do not interrupt latest essential checks of the active PR.
              if (run.head_sha === latest && ['API', 'Web'].includes(run.name)) {
                core.info('Preserving current ' + run.name + ' #' + run.id);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info('Cancellation requested: ' + run.name + ' #' + run.id +
                  ' (' + run.head_sha.slice(0, 8) + ')');
                cancelled += 1;
              } catch (error) {
                if (error.status === 409 || error.status === 422) {
                  core.info('Already completed: #' + run.id);
                } else {
                  throw error;
                }
              }
            }
            core.info('Requested cancellation of ' + cancelled + ' redundant run(s)');
