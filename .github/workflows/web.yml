name: Web

on:
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run full Playwright visual, responsive and accessibility checks"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "prototype/**"
      - ".github/workflows/web.yml"
      - "scripts/quality/**"
      - "scripts/tests/test_quality_added_lines.py"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "prototype/**"
      - ".github/workflows/web.yml"

concurrency:
  # Only cancel superseded PR commits, never a manually requested gate or main push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RODADA_TEST_PYTHON: python
    # Give extra time only to deliberately requested visual checks.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual && 45 || 20 }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_DB: rodada_web_e2e
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_web_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install real API test dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Install test browser and system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: ESLint Next.js 16 — full audit, fail on new/fatal diagnostics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/quality/check_added_lines.py --kind eslint --base "$BASE_SHA"

      - name: New Web source safety directives (added lines only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/quality/check_added_lines.py --kind web --base "$BASE_SHA"

      - name: Staff session coordination tests
        working-directory: apps/web
        run: npm run test:auth

      - name: Tenant path and hostname regression tests
        working-directory: apps/web
        run: npm run test:tenant

      - name: Table-first identity regression tests
        working-directory: apps/web
        run: npm run test:identity

      - name: Build
        working-directory: apps/web
        env:
          RODADA_API_BASE_URL: http://127.0.0.1:8100
        run: npm run build

      - name: Table-service gateway authentication and financial isolation
        working-directory: apps/web
        run: npm run test:table-service

      - name: Spec 027 focused responsive and recovery contracts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        working-directory: apps/web
        run: npm run test:visual -- table-service.spec.ts

      - name: E2E PostgreSQL reset coordination regressions
        run: python -m unittest discover -s apps/web/tests/integration -p 'test_e2e_db_guard.py' -v

      - name: Real Web BFF API workflows
        working-directory: apps/web
        env:
          RODADA_E2E_POSTGRES: "1"
          POSTGRES_DB: rodada_web_e2e
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_HOST: 127.0.0.1
        run: npm run test:integration

      - name: Visual, responsive and accessibility gates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        working-directory: apps/web
        run: npm run test:visual

      - name: Upload visual evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-and-integration
          path: |
            visual-artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
