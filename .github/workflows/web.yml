name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "prototype/**"
      - "docs/design/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "prototype/**"
      - "docs/design/**"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rodada_web_e2e
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_web_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install real API test dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Install test browser and system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Staff session coordination tests
        working-directory: apps/web
        run: npm run test:auth

      - name: Build
        working-directory: apps/web
        env:
          RODADA_API_BASE_URL: http://127.0.0.1:8100
        run: npm run build

      - name: Visual, responsive and accessibility gates
        working-directory: apps/web
        run: npm run test:visual

      - name: Real Web BFF API workflows
        working-directory: apps/web
        env:
          RODADA_E2E_POSTGRES: "1"
          POSTGRES_DB: rodada_web_e2e
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_HOST: 127.0.0.1
        run: npm run test:integration

      - name: Upload visual evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-and-integration
          path: |
            visual-artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
