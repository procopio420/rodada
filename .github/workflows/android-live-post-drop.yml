name: Android real POST disconnect

on:
  pull_request:
    paths:
      - "apps/attendance-android/**"
      - "apps/api/**"
      - "scripts/android-live-post-drop.sh"
      - "scripts/android-active-network-cut.sh"
      - "scripts/android-post-drop-proxy.py"
      - "scripts/verify-android-live-post-drop.py"
      - ".github/workflows/android-live-post-drop.yml"
  push:
    branches: [main]
    paths:
      - "apps/attendance-android/**"
      - "apps/api/**"
      - "scripts/android-live-post-drop.sh"
      - "scripts/android-active-network-cut.sh"
      - "scripts/android-post-drop-proxy.py"
      - "scripts/verify-android-live-post-drop.py"
      - ".github/workflows/android-live-post-drop.yml"

jobs:
  real-post-after-commit-disconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: rodada_api.settings
      PYTHONPATH: apps/api
      POSTGRES_DB: rodada_android_post_drop
      POSTGRES_USER: rodada_test
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: disposable-only-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      RODADA_POST_DROP_FIXTURE: /tmp/rodada-android-live-fixture.json
      RODADA_POST_DROP_MARKER: /tmp/rodada-android-live-drop.json
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rodada_android_post_drop
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_android_post_drop"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install disposable Django backend
        run: python -m pip install -e "apps/api[dev]"
      - name: Migrate isolated PostgreSQL and create only test Venue, user and product
        run: |
          python apps/api/manage.py migrate --noinput
          python scripts/verify-android-live-post-drop.py prepare
      - name: Start real Django and TCP response-drop proxy
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/api && nohup python manage.py runserver 0.0.0.0:8101 --noreload </dev/null >/tmp/rodada-android-django.log 2>&1 &)
          nohup python3 scripts/android-post-drop-proxy.py \
            --evidence "$RODADA_POST_DROP_MARKER" </dev/null >/tmp/rodada-android-fault-proxy.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8101/ready/ >/dev/null && \
               curl -fsS http://127.0.0.1:8000/__fault/status >/dev/null; then
              echo "PASS: PostgreSQL-backed Django + real fault proxy both reachable"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rodada-android-django.log /tmp/rodada-android-fault-proxy.log
          exit 1
      - name: Install compile SDK 37 and Android emulator prerequisites
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Live Android POST TCP drop, offline process restart and same-key reconciliation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash scripts/android-live-post-drop.sh
      - name: Upload factual verification and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-post-disconnect-evidence
          path: |
            artifacts/android-real-post-drop.json
            /tmp/rodada-android-fault-proxy.log
            /tmp/rodada-android-django.log
          if-no-files-found: warn
          retention-days: 7

  actual-network-uplink-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: rodada_api.settings
      PYTHONPATH: apps/api
      POSTGRES_DB: rodada_android_post_drop_link_cut
      POSTGRES_USER: rodada_test
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: disposable-only-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      RODADA_POST_DROP_FIXTURE: /tmp/rodada-android-live-fixture.json
      RODADA_POST_DROP_MARKER: /tmp/rodada-android-live-drop.json
      RODADA_NETWORK_CUT_MODE: emulator-link
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rodada_android_post_drop_link_cut
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_android_post_drop_link_cut"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install disposable Django backend
        run: python -m pip install -e "apps/api[dev]"
      - name: Migrate PostgreSQL and seed unique isolated venue
        run: |
          python apps/api/manage.py migrate --noinput
          python scripts/verify-android-live-post-drop.py prepare
      - name: Start Django and HOLD real committed HTTP response (no TCP RST)
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/api && nohup python manage.py runserver 0.0.0.0:8101 --noreload </dev/null >/tmp/rodada-android-django.log 2>&1 &)
          nohup python3 scripts/android-post-drop-proxy.py --hold-response \
            --evidence "$RODADA_POST_DROP_MARKER" </dev/null >/tmp/rodada-android-fault-proxy.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8101/ready/ >/dev/null && \
               curl -fsS http://127.0.0.1:8000/__fault/status >/dev/null; then
              echo "PASS: real PostgreSQL-backed Django and response hold proxy ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rodada-android-django.log /tmp/rodada-android-fault-proxy.log
          exit 1
      - name: Install SDK 37 and enable host KVM
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Cut actual Android eth0 link DURING POST, force-stop offline and reconcile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash scripts/android-active-network-cut.sh
      - name: Upload transport and PostgreSQL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-actual-link-cut-evidence
          path: |
            artifacts/android-active-network-cut.json
            /tmp/rodada-android-fault-proxy.log
            /tmp/rodada-android-django.log
          if-no-files-found: warn
          retention-days: 7
