name: Android real POST disconnect

on:
  workflow_dispatch:
  # Keep expensive Android emulator coverage opt-in for regular app changes.
  # Run the cross-surface gate automatically only if its own proof/code changes.
  pull_request:
    paths:
      - ".github/workflows/android-live-post-drop.yml"
      - "apps/web/playwright.android-cross-surface.config.ts"
      - "apps/web/tests/cross-surface/**"
      - "scripts/verify-android-web-cross-surface.py"
      - "scripts/verify-android-live-post-drop.py"
      - "scripts/cross_surface_fixture.py"
      - "scripts/android-compose-order.sh"
      - "scripts/verify-android-compose-order.py"
      - "scripts/verify-qr-lifecycle.py"
      - "scripts/verify-browser-origins.py"
      - "scripts/run-issue106-concurrency.py"
      - "scripts/verify-issue106-concurrency.py"
      - "scripts/verify-issue106-authorization.py"
      - "scripts/verify-issue106-sse.py"
      - "scripts/verify-issue106-pending.py"
      - "scripts/verify-issue106-unavailable.py"
      - "scripts/verify-financial-ui.py"
      - "apps/web/tests/cross-surface-financial/**"
      - "scripts/sanitize-cross-surface-traces.py"
      - "scripts/tests/test_trace_redaction.py"
      - "apps/attendance-android/app/src/androidTest/**/LiveComposeOrderTest.kt"
      - "scripts/tests/test_cross_surface_fixture.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-post-after-commit-disconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: rodada_api.settings
      PYTHONPATH: apps/api
      POSTGRES_DB: rodada_android_post_drop
      POSTGRES_USER: rodada_test
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: disposable-only-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      RODADA_BFF_HOST_SECRET: rodada-integration-local-only
      RODADA_POST_DROP_FIXTURE: /tmp/rodada-android-live-fixture.json
      RODADA_POST_DROP_MARKER: /tmp/rodada-android-live-drop.json
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_DB: rodada_android_post_drop
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_android_post_drop"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install disposable Django backend
        run: python -m pip install -e "apps/api[dev]"
      - name: Test trace credential redaction
        run: python -m unittest discover -s scripts/tests -p test_trace_redaction.py -v
      - name: Reject unsafe shared-fixture destinations before any seed
        run: python -m unittest discover -s scripts/tests -p test_cross_surface_fixture.py -v
      - name: Migrate isolated PostgreSQL and create only test Venue, user and product
        run: |
          echo "RODADA_TEST_DB_CONTAINER_ADDRESS=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')" >> "$GITHUB_ENV"
          python apps/api/manage.py migrate --noinput
      - name: Prepare fixture against the inspected disposable PostgreSQL service
        run: |
          python scripts/verify-android-live-post-drop.py prepare
          python scripts/verify-android-live-post-drop.py prepare-resilience
          python scripts/verify-android-live-post-drop.py prepare-pending
      - name: Start real Django and TCP response-drop proxy
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/api && nohup python -m uvicorn rodada_api.asgi:application --host 0.0.0.0 --port 8101 </dev/null >/tmp/rodada-android-django.log 2>&1 &)
          nohup python3 scripts/android-post-drop-proxy.py \
            --evidence "$RODADA_POST_DROP_MARKER" </dev/null >/tmp/rodada-android-fault-proxy.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8101/ready/ >/dev/null && \
               curl -fsS http://127.0.0.1:8000/__fault/status >/dev/null; then
              echo "PASS: PostgreSQL-backed Django + real fault proxy both reachable"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rodada-android-django.log /tmp/rodada-android-fault-proxy.log
          exit 1
      - name: Shared PostgreSQL concurrent HTTP commands through the existing barrier harness
        run: python scripts/run-issue106-concurrency.py
      - name: Install compile SDK 37 and Android emulator prerequisites
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Live Android POST TCP drop, offline process restart and same-key reconciliation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: |
            bash scripts/android-live-post-drop.sh
            bash scripts/android-table-service-post-drop.sh
            bash scripts/android-compose-order.sh
      # The native emulator just committed and recovered the order in this
      # exact PostgreSQL DB. Do not start the Web fixture runner's own DB:
      # Web must read and mutate the native-origin Order/Tab, not a mock order.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install and build actual Web station for native-origin order
        working-directory: apps/web
        env:
          RODADA_API_BASE_URL: http://127.0.0.1:8101
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run build
      - name: Cross-client Chromium Web Bar preparation of Android-created order
        working-directory: apps/web
        env:
          RODADA_API_BASE_URL: http://127.0.0.1:8101
          RODADA_ANDROID_PROOF: ${{ github.workspace }}/artifacts/android-real-post-drop.json
          RODADA_ANDROID_COMPOSE_PROOF: ${{ github.workspace }}/artifacts/android-compose-order.json
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3110 >/tmp/rodada-cross-surface-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3110/staff >/dev/null; then break; fi
            if [ "$i" -eq 80 ]; then cat /tmp/rodada-cross-surface-next.log; exit 1; fi
            sleep 2
          done
          npx playwright test --config playwright.android-cross-surface.config.ts
      - name: Independently reconcile native order and Web READY state in PostgreSQL
        run: |
          python scripts/verify-android-web-cross-surface.py
          python scripts/verify-qr-lifecycle.py
          python scripts/verify-browser-origins.py
          python scripts/verify-issue106-concurrency.py
          python scripts/verify-issue106-authorization.py
          python scripts/verify-issue106-sse.py
          python scripts/verify-issue106-pending.py
          python scripts/verify-issue106-unavailable.py
      - name: Financial UI on the same native-origin Tab and disposable drawer
        working-directory: apps/web
        env:
          RODADA_API_BASE_URL: http://127.0.0.1:8101
          RODADA_ANDROID_COMPOSE_PROOF: ${{ github.workspace }}/artifacts/android-compose-order.json
          RODADA_CROSS_PHASE: financial
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3110 >/tmp/rodada-cross-financial-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3110/staff >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test --config playwright.android-cross-surface.config.ts
      - name: Independently reconcile partial payments and drawer SQL
        run: python scripts/verify-financial-ui.py
      - name: Export redacted traces
        if: always()
        run: python scripts/sanitize-cross-surface-traces.py
      - name: Upload factual verification and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-post-disconnect-evidence
          path: |
            artifacts/android-real-post-drop.json
            artifacts/android-web-cross-surface.json
            artifacts/android-compose-*.json
            artifacts/android-compose-*.txt
            artifacts/android-compose-*.png
            artifacts/qr-lifecycle-*.json
            artifacts/browser-origins*.json
            artifacts/concurrency-*.json
            artifacts/isolation-*.json
            artifacts/revocation-*.json
            artifacts/sse-*.json
            artifacts/pending-payment-*.json
            artifacts/unavailable-cart-*.json
            artifacts/financial*.json
            artifacts/sanitized-traces/
            /tmp/rodada-cross-surface-next.log
            artifacts/android-table-*-response-loss.json
            /tmp/rodada-android-fault-proxy.log
            /tmp/rodada-android-django.log
          if-no-files-found: warn
          retention-days: 7

  actual-network-uplink-cut:
    # Physical/uplink-style acceptance remains manually dispatched, not every PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: rodada_api.settings
      PYTHONPATH: apps/api
      POSTGRES_DB: rodada_android_post_drop_link_cut
      POSTGRES_USER: rodada_test
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: disposable-only-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      RODADA_POST_DROP_FIXTURE: /tmp/rodada-android-live-fixture.json
      RODADA_POST_DROP_MARKER: /tmp/rodada-android-live-drop.json
      RODADA_NETWORK_CUT_MODE: emulator-link
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_DB: rodada_android_post_drop_link_cut
          POSTGRES_USER: rodada_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodada_test -d rodada_android_post_drop_link_cut"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install disposable Django backend
        run: python -m pip install -e "apps/api[dev]"
      - name: Migrate PostgreSQL and seed unique isolated venue
        run: |
          echo "RODADA_TEST_DB_CONTAINER_ADDRESS=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')" >> "$GITHUB_ENV"
          python apps/api/manage.py migrate --noinput
      - name: Prepare link-cut fixture against the inspected disposable PostgreSQL service
        run: |
          python scripts/verify-android-live-post-drop.py prepare
      - name: Start Django and HOLD real committed HTTP response (no TCP RST)
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/api && nohup python -m uvicorn rodada_api.asgi:application --host 0.0.0.0 --port 8101 </dev/null >/tmp/rodada-android-django.log 2>&1 &)
          nohup python3 scripts/android-post-drop-proxy.py --hold-response \
            --evidence "$RODADA_POST_DROP_MARKER" </dev/null >/tmp/rodada-android-fault-proxy.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8101/ready/ >/dev/null && \
               curl -fsS http://127.0.0.1:8000/__fault/status >/dev/null; then
              echo "PASS: real PostgreSQL-backed Django and response hold proxy ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rodada-android-django.log /tmp/rodada-android-fault-proxy.log
          exit 1
      - name: Install SDK 37 and enable host KVM
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Cut actual Android eth0 link DURING POST, force-stop offline and reconcile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash scripts/android-active-network-cut.sh
      - name: Upload transport and PostgreSQL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-actual-link-cut-evidence
          path: |
            artifacts/android-active-network-cut.json
            /tmp/rodada-android-fault-proxy.log
            /tmp/rodada-android-django.log
          if-no-files-found: warn
          retention-days: 7
