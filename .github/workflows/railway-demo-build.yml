name: Railway Aderlan demo Docker smoke

on:
  # Avoid rebuilding the entire multi-service image on routine app PRs.
  pull_request:
    paths:
      - 'deploy/railway/**'
      - 'scripts/verify-aderlan-staging.py'
      - '.github/workflows/railway-demo-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only cancel superseded PR commits, never a manually requested gate or main push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build complete Railway image
        run: docker build --progress=plain -f deploy/railway/Dockerfile -t rodada-aderlan-demo:ci .
      - name: Start disposable private database and app
        shell: bash
        run: |
          set -euo pipefail
          docker network create rodada-demo-ci
          docker run -d --name rodada-demo-postgres --network rodada-demo-ci \
            -e POSTGRES_DB=rodada_demo_ci \
            -e POSTGRES_USER=rodada_ci \
            -e POSTGRES_PASSWORD=ci-local-only \
            --health-cmd="pg_isready -U rodada_ci -d rodada_demo_ci" \
            --health-interval=3s --health-retries=30 \
            postgres:17
          docker run -d --name rodada-demo-app --network rodada-demo-ci \
            -p 127.0.0.1:18080:8080 \
            -e PORT=8080 \
            -e POSTGRES_HOST=rodada-demo-postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=rodada_demo_ci \
            -e POSTGRES_USER=rodada_ci \
            -e POSTGRES_PASSWORD=ci-local-only \
            -e DJANGO_SECRET_KEY=ci-local-only-secret-not-used-outside-github-actions \
            rodada-aderlan-demo:ci
      - name: Validate startup and all four pages with no browser authentication
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' rodada-demo-app)" != true ]; then
              echo "App container stopped before readiness" >&2
              docker logs rodada-demo-app --tail 150
              exit 1
            fi
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/staff || true)
            if [ "$code" = "200" ]; then break; fi
            if [ "$i" = "120" ]; then
              echo "Application did not become ready" >&2
              docker logs rodada-demo-app --tail 150
              exit 1
            fi
            sleep 2
          done
          # Wait until Next.js is ready before checking application pages.
          for i in $(seq 1 60); do
            web_code=$(curl -s -L -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/staff || true)
            if [ "$web_code" = "200" ]; then break; fi
            if [ "$i" = "60" ]; then
              echo "Next.js never became ready; last /staff status: $web_code" >&2
              docker logs rodada-demo-app --tail 150
              exit 1
            fi
            sleep 2
          done
          for page in staff attendance bar kitchen manage cash reports; do
            status=$(curl -s -L -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/$page")
            echo "/$page -> HTTP $status"
            test "$status" = "200"
          done
          python3 scripts/verify-aderlan-staging.py --base http://127.0.0.1:18080 \
            --evidence /tmp/rodada-staging-surface-check.json
      - name: Wait for canonical Django API and completed seed
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' rodada-demo-app)" != true ]; then
              echo "App exited before Django API readiness" >&2
              docker logs rodada-demo-app --tail 150
              exit 1
            fi
            # Django /ready/ verifies a live DB connection. The app container's
            # startup script completes migrations and demo seed before serving.
            status=$(docker exec rodada-demo-app python -c "from urllib.request import urlopen; print(urlopen('http://127.0.0.1:8000/ready/', timeout=3).status)" 2>/dev/null || true)
            if [ "$status" = "200" ]; then break; fi
            if [ "$i" = "120" ]; then
              echo "Django API never became ready; final status: $status" >&2
              docker logs rodada-demo-app --tail 150
              exit 1
            fi
            sleep 2
          done
      - name: Verify tenant ingress and shared API after Django readiness
        shell: bash
        run: |
          set -euo pipefail
          # Security review regression: ingress preserves guest pages, shared
          # API for native/webhooks, and fresh pilot domain after migrations.
          host_status() {
            curl -sS -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1:18080$2"
          }
          assert_host_status() {
            local host="$1" path="$2" expected="$3" actual
            actual=$(host_status "$host" "$path")
            echo "$host $path -> HTTP $actual (expected $expected)"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL: ingress host routing: $host $path returned $actual, expected $expected" >&2
              curl -sS -i -H "Host: $host" "http://127.0.0.1:18080$path" | head -c 900 || true
              exit 1
            fi
          }
          assert_host_status api.rodada.bar /ready/ 200
          assert_host_status bardoaderlan.rodada.bar /api/venue/context 200
          assert_host_status bardoaderlan.rodada.bar /cozinha 200
          assert_host_status bardoaderlan.rodada.bar /auth/me/ 403
          assert_host_status bardoaderlan.rodada.bar /guest/qr-test-token 200
          assert_host_status naocadastrado.rodada.bar /api/venue/context 421
          # This SumUp handler ignores unsigned notifications for unknown checkouts;
          # its 204 proves the shared API host is not incorrectly parsed as a Venue.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Host: api.rodada.bar" -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:18080/payments/webhooks/sumup/00000000-0000-0000-0000-000000000000/)
          echo "api.rodada.bar SumUp webhook -> HTTP $status (expected 204)"
          test "$status" = "204"
          echo "PASS: reserved API, tenant BFF, no direct token endpoints, unknown host, guest QR UI, PSP callback"
          docker logs rodada-demo-app --tail 100
      - name: Submit canonical test order and verify both production queues
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i rodada-demo-app python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from uuid import uuid4

          BASE = "http://127.0.0.1:8000"

          def api(method, path, data=None, token=None):
              body = json.dumps(data).encode() if data is not None else None
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = Request(BASE + path, data=body, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=15) as response:
                      return response.status, json.load(response)
              except HTTPError as error:
                  raise AssertionError(f"{method} {path}: HTTP {error.code} {error.read().decode()[:300]}") from error

          status, login = api("POST", "/auth/login/", {
              "venue_slug": "bar-do-aderlan",
              "login_identifier": "ana",
              "pin": "0420",
              "installation_id": "railway-ci-demo-smoke",
              "platform": "WEB",
          })
          assert status == 200, login
          token = login["access_token"]
          _, catalog = api("GET", "/catalog/products/", token=token)
          bar = next(p for p in catalog["results"] if p["fulfillment_station"] == "BAR")
          kitchen = next(p for p in catalog["results"] if p["fulfillment_station"] == "KITCHEN")
          # Startup must provision exactly one occupied sample physical table and tab.
          _, tables = api("GET", "/hospitality/tables/", token=token)
          sample = [t for t in tables["results"] if t["label"] == "01"]
          assert len(sample) == 1, sample
          sample = sample[0]
          assert sample["status"] == "OCCUPIED", sample
          assert len(sample["active_occupancy"]["tabs"]) == 1, sample
          assert sample["active_occupancy"]["tabs"][0]["display_label"] == "Cliente Exemplo - Mesa 01", sample
          print("PASS: Mesa 01 occupied, example customer tab assigned")
          status, tab = api("POST", "/tabs/", {"display_label": "CI demo smoke"}, token)
          assert status == 201, tab
          status, order = api("POST", f"/tabs/{tab['id']}/orders/confirm/", {
              "idempotency_key": "railway-smoke-" + str(uuid4()),
              "lines": [{"product_id": bar["id"], "quantity": 1},
                        {"product_id": kitchen["id"], "quantity": 1}],
          }, token)
          assert status == 201 and len(order["items"]) == 2, order
          for station, product in (("BAR", bar), ("KITCHEN", kitchen)):
              status, queue = api("GET", f"/production/{station}/", token=token)
              assert status == 200
              assert any(item["order_id"] == order["id"] and
                         item["product_id"] == product["id"]
                         for item in queue["results"]), (station, queue)
          print("PASS: persisted test order appears in BAR and KITCHEN production queues")
          PY
      - name: Verify same-origin BFF login through non-default port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GATE'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = "http://127.0.0.1:18080"
          body = json.dumps({"venue_slug": "bar-do-aderlan", "login_identifier": "ana", "pin": "0420"}).encode()
          for origin, fetch_site, expected in ((base, "same-origin", 200),
                                               ("http://127.0.0.1:18081", "same-origin", 403),
                                               ("https://untrusted.example", "cross-site", 403),
                                               (base, "cross-site", 403)):
              request = Request(base + "/api/auth/login", data=body,
                  headers={"Content-Type": "application/json", "Origin": origin, "Sec-Fetch-Site": fetch_site})
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
              except HTTPError as error:
                  status = error.code
              assert status == expected, (origin, fetch_site, status, expected)
          print("PASS: same-origin BFF login and cross-origin rejection through Nginx")
          PY_GATE
      - name: Logs on failure
        if: failure()
        run: |
          docker logs rodada-demo-app --tail 250 || true
          docker logs rodada-demo-postgres --tail 100 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f rodada-demo-app rodada-demo-postgres || true
          docker network rm rodada-demo-ci || true
