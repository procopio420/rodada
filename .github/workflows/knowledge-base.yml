name: Knowledge Base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
      - ".agents/skills/**"
      - "README.md"
      - "apps/**/AGENTS.md"
      - "apps/web/README.md"
      - "docs/agents/**"
      - "docs/ops/**"
      - "docs/adr/**"
      - "docs/architecture/tenant-routing-contract.md"
      - "specs/025-tenant-host-routing/**"
      - "scripts/check_agent_kb.py"
      - "scripts/agent_evals.py"
      - "scripts/spec_evidence.py"
      - "scripts/e2e_evidence.py"
      - "scripts/tests/test_e2e_evidence.py"
      - "docs/releases/issue-106-evidence-contract.md"
      - "scripts/tests/test_agent_evals.py"
      - "scripts/tests/test_spec_evidence.py"
      - "scripts/tests/test_check_agent_kb.py"
      - ".github/workflows/knowledge-base.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "README.md"
      - "apps/**/AGENTS.md"
      - "apps/web/README.md"
      - "docs/agents/**"
      - "docs/adr/**"
      - "docs/architecture/tenant-routing-contract.md"
      - "specs/025-tenant-host-routing/**"
      - "scripts/check_agent_kb.py"
      - "scripts/agent_evals.py"
      - "scripts/spec_evidence.py"
      - "scripts/e2e_evidence.py"
      - "scripts/tests/test_e2e_evidence.py"
      - "docs/releases/issue-106-evidence-contract.md"
      - "scripts/tests/test_agent_evals.py"
      - "scripts/tests/test_spec_evidence.py"
      - "scripts/tests/test_check_agent_kb.py"
      - ".github/workflows/knowledge-base.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links-and-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s scripts/tests -p test_check_agent_kb.py -v
      - name: Validate Codex eval contracts and spec evidence (no model invocation)
        run: |
          python -m unittest discover -s scripts/tests -p test_agent_evals.py -v
          python -m unittest discover -s scripts/tests -p test_spec_evidence.py -v
          python -m unittest discover -s scripts/tests -p test_e2e_evidence.py -v
          python scripts/agent_evals.py validate
          python scripts/spec_evidence.py validate
          python scripts/spec_evidence.py report >> "$GITHUB_STEP_SUMMARY"
      - name: Validate agent references and canonical domain
        run: python scripts/check_agent_kb.py
