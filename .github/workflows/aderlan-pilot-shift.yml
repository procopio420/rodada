name: Aderlan isolated pilot shift acceptance
on:
  workflow_dispatch:
  push:
    branches: [qa/aderlan-e2e-current-20261013]

permissions:
  contents: read

jobs:
  disposable-full-shift:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      RODADA_DEMO_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17
    steps:
      - uses: actions/checkout@v4
      - name: Complete pilot acceptance against disposable PostgreSQL
        run: bash scripts/verify-aderlan-full-shift.sh | tee /tmp/rodada-aderlan-full-shift.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Upload non-sensitive shift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aderlan-isolated-acceptance
          path: |
            artifacts/aderlan-full-shift.json
            artifacts/aderlan-busy-shift.json
            artifacts/aderlan-pilot-qa-summary.json
            /tmp/rodada-aderlan-full-shift.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: docker compose -f demo/compose.yaml down

  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install browser runner
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify production module navigation with strict HTTPS, read-only
        working-directory: apps/web
        run: node tests/live-tenant-smoke.mjs
