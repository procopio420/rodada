name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/attendance-android/**"
      - "scripts/android-force-stop-recovery.sh"
      - "scripts/lib/android-instrumentation-result.sh"
      - "scripts/tests/test_android_instrumentation_result.py"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/attendance-android/**"

concurrency:
  # Only cancel superseded PR commits, never a manually requested gate or main push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Instrumentation result parser regression
        run: python3 -m unittest discover -s scripts/tests -p test_android_instrumentation_result.py -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/attendance-android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug build
        working-directory: apps/attendance-android
        run: ./gradlew assembleDebug --stacktrace

      # Initial PR #129 lintDebug audit PASSED: now a blocking check, without release signing.
      - name: Android Lint (blocking)
        working-directory: apps/attendance-android
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            apps/attendance-android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      # Never upload this artifact: a new ephemeral test key is created on every CI run.
      - name: Smoke-check release AAB with disposable signing key
        # Keep AAB packaging smoke on main/manual runs; Play publishing stays independent.
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-play-upload.jks" \
            -alias disposable-ci-key -keyalg RSA -keysize 3072 -validity 1 \
            -storepass disposable-ci-only -keypass disposable-ci-only \
            -dname "CN=Disposable CI, O=Rodada, C=BR"
          cd apps/attendance-android
          RODADA_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/ci-play-upload.jks" \
          RODADA_UPLOAD_STORE_PASSWORD="disposable-ci-only" \
          RODADA_UPLOAD_KEY_ALIAS="disposable-ci-key" \
          RODADA_UPLOAD_KEY_PASSWORD="disposable-ci-only" \
          RODADA_RELEASE_API_BASE_URL="https://ci.rodada.ai/" \
            ./gradlew :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          rm -f "$RUNNER_TEMP/ci-play-upload.jks"

  forced-stop-recovery:
    # Heavy emulator verification is part of explicit release/recovery checks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM for headless Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Install app compileSdk 37 for instrumentation
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Prove encrypted queue survives real adb force-stop and offline startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash scripts/android-force-stop-recovery.sh
