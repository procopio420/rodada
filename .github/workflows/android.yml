name: Android

on:
  pull_request:
    paths:
      - "apps/attendance-android/**"
      - "scripts/android-force-stop-recovery.sh"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/attendance-android/**"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/attendance-android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug build
        working-directory: apps/attendance-android
        run: ./gradlew assembleDebug --stacktrace

  forced-stop-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM for headless Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Install app compileSdk 37 for instrumentation
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Prove encrypted queue survives real adb force-stop and offline startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash scripts/android-force-stop-recovery.sh
