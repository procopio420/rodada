name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
  push:
    branches: [main]
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Django checks
        run: python manage.py check --settings=rodada_api.settings_test

      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run --settings=rodada_api.settings_test

      - name: Tests
        run: pytest
