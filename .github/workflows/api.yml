name: API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

concurrency:
  # Only cancel superseded PR commits, never a manually requested gate or main push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_DB: rodada
          POSTGRES_USER: rodada
          POSTGRES_PASSWORD: rodada
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Django checks
        run: python manage.py check --settings=rodada_api.settings

      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run --settings=rodada_api.settings

      - name: Tests on PostgreSQL (including concurrency)
        run: pytest --ds=rodada_api.settings
