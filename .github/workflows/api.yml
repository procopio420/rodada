name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
  push:
    branches: [main]
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Django checks
        run: python manage.py check --settings=rodada_api.settings_test

      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run --settings=rodada_api.settings_test

      - name: Tests
        run: pytest

  house-account-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rodada
          POSTGRES_USER: rodada
          POSTGRES_PASSWORD: rodada
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: House Account row locking, migration and HTTP E2E
        run: pytest tests/test_house_account.py tests/test_house_account_migration.py tests/test_house_account_e2e.py --ds=rodada_api.settings
