server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /privacidade { try_files /privacidade.html =404; }
  location = /termos { try_files /termos.html =404; }
  location = /exclusao-de-conta { try_files /exclusao-de-conta.html =404; }
  location / { try_files $uri $uri/ =404; }
}
