server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /downloads { try_files /downloads.html =404; }
  location = /downloads/rodada-impressoras/windows/manifest.json {
    add_header Cache-Control "no-store" always;
    try_files /windows-stable.json =404;
  }
  location = /downloads/rodada-impressoras/windows/latest {
    add_header Cache-Control "no-store" always;
    return 503 "Ainda não há instalador estável aprovado. Consulte /downloads.\n";
  }
  location = /privacidade { try_files /privacidade.html =404; }
  location = /termos { try_files /termos.html =404; }
  location = /exclusao-de-conta { try_files /exclusao-de-conta.html =404; }
  location / { try_files $uri $uri/ =404; }
}
