[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rodada-api"
version = "0.1.0"
description = "Rodada modular monolith API"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2.12,<5.3",
  "djangorestframework>=3.18.1,<3.19",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rodada_api*", "modules*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rodada_api.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
