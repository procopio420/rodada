[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rodada-printer-agent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pywin32>=311,<312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=1.18,<2", "types-pywin32>=311"]

[tool.setuptools.packages.find]
include = ["rodada_printer_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"
